name: 'Google Cloud Deploy Actions Collection'
description: 'Run Cloud Deploy actions for Google Project'
author: 'drew.mercer'
inputs: 
  deploy_type:
    description: 'Cloud Run or GKE'
    required: true
  directory:
    description: 'Directory to run Cloud Deploy in'
    required: false
    default: './.gcp'
  service_definition:
    description: 'Service Definition'
    required: false
    default: 'service.yaml'
  project_id: 
    description: 'Project ID'
    required: true
  region: 
    description: 'Region'
    required: true
  environment: 
    description: 'Environment'
    required: false
  service_name: 
    description: 'Service Name'
    required: true
  image: 
    description: 'Docker Image URI'
    required: true
  cloud_run_sa: 
    description: 'Cloud Run Service Account'
    required: true
  vpc_access_connector: 
    description: 'VPC Access Connector'
    required: true

runs:
  using: "composite"
  steps:
  - id: create_service
    if: ${{ inputs.deploy_type == 'cloudrun' }}
    run: |
      export SERVICE_NAME="${{ inputs.service_name }}"
      export PROJECT_ID="${{ inputs.project_id }}"
      export IMAGE="${{ inputs.image }}"
      export CLOUD_RUN_SA="${{ inputs.cloud_run_sa }}"
      export ENVIRONMENT="${{ inputs.environment }}"
      export VPC_ACCESS_CONNECTOR="${{ inputs.vpc_access_connector }}"
      RENDERED="${{ inputs.service_name }}-${{ inputs.environment }}.yaml"
      envsubst < ${{ inputs.directory}}/${{ inputs.service_definition }} > "$RENDERED"

      # `services replace` is declarative: an unchanged spec creates no revision and
      # still exits 0, so redeploying the same image silently does nothing. Stamping
      # the run id into the revision template guarantees a rollout. BDEV-5770
      DEPLOY_ID="${GITHUB_RUN_ID:-$(date -u +%s)}-${GITHUB_RUN_ATTEMPT:-1}"
      awk -v id="$DEPLOY_ID" '
        BEGIN { in_template = 0; stamped = 0 }
        { print }
        /^  template:[[:space:]]*$/ { in_template = 1 }
        in_template && !stamped && /^      annotations:[[:space:]]*$/ {
          print "        brandlive.com/deploy-id: \"" id "\""
          stamped = 1
        }
      ' "$RENDERED" > "$RENDERED.stamped"
      mv "$RENDERED.stamped" "$RENDERED"

      if ! grep -q 'brandlive.com/deploy-id' "$RENDERED"; then
        echo "::error::could not stamp deploy-id: no spec.template.metadata.annotations block in $RENDERED"
        exit 1
      fi

      cat "$RENDERED"
    shell: bash
  
  - id: deploy_service
    if: ${{ inputs.deploy_type == 'cloudrun' }}
    uses: google-github-actions/deploy-cloudrun@v2
    with:
      service: ${{ env.service_name }}
      region: ${{ inputs.region }}
      metadata: ${{ inputs.service_name }}-${{ inputs.environment }}.yaml